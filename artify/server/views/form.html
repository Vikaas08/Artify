<!DOCTYPE html>
<html>
  <head>
    <title>My App Engine App</title>
  </head>
  <body>
    <h2>Register</h2>
    <form method="POST" action="/register">
      <input type="text" name="Fullname" placeholder="John Doe" required="true"><br>
      <input type="email" name="Email" placeholder="Enter Email" required="true" ><br>
      <input type="password" name="Password" placeholder="Enter Password" required="true"><br>
      <button type="submit">Register</button>
    </form>
  </body>
</html>
